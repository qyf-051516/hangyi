server:
  port: ${SCHEDULE_PORT:9002}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: hangyi-schedule
  datasource:
    url: jdbc:mysql://localhost:3306/hangyi_scheduling?serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET required}


hangyi:
  solver:
    preview-timeout-ms: 2000
    commit-timeout-ms: 5000
    move-thread-count: AUTO

logging:
  level:
    com.qyf.hangyi.schedule: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
    health:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
    openfeign:
      client:
        config:
          hangyi-core:
            url: "http://${CORE_HOST:localhost}:${CORE_PORT:9001}"
